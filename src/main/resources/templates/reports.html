<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports — Task Manager</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
  <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
  <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" th:href="@{/}">
      <i class="bi bi-kanban me-1"></i> Task Manager
    </a>
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/works}" class="btn btn-outline-light btn-sm">
        <i class="bi bi-clock-history me-1"></i> All Works
      </a>
      <span class="text-white-50 small">
                <i class="bi bi-person-circle me-1"></i>
                <span sec:authentication="name">User</span>
            </span>
      <form th:action="@{/logout}" method="post" class="m-0">
        <button class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
      </form>
    </div>
  </div>
</nav>

<div class="container mt-4" style="max-width: 900px;">

  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <i class="bi bi-check-circle me-1"></i> <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <i class="bi bi-exclamation-triangle me-1"></i> <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <a th:href="@{/}" class="btn btn-outline-secondary btn-sm me-2">
        <i class="bi bi-arrow-left me-1"></i> Back to Tasks
      </a>
      <h4 class="d-inline fw-bold mb-0">
        <i class="bi bi-file-earmark-text me-1 text-primary"></i> Reports
      </h4>
    </div>
    <a th:href="@{/reports/new}" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg"></i> New Report
    </a>
  </div>

  <div th:if="${#lists.isEmpty(reports)}" class="text-center text-muted py-5">
    <i class="bi bi-file-earmark-text fs-1 d-block mb-2"></i>
    <p class="lead">No reports yet. Create one for your self-review or retrospective.</p>
  </div>

  <div th:if="${not #lists.isEmpty(reports)}" class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
        <tr>
          <th>Title</th>
          <th>Period</th>
          <th th:if="${isAdmin}">Owner</th>
          <th>Scope</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${reports}" style="cursor:pointer;"
            th:onclick="|window.location.href='@{/reports/__${r.id}__}'|">
          <td class="fw-semibold">
            <i class="bi bi-file-earmark-text me-1 text-muted"></i>
            <span th:text="${r.title}"></span>
          </td>
          <td class="small text-nowrap">
            <span th:text="${#temporals.format(r.startDate, 'MMM d, yyyy')}"></span>
            —
            <span th:text="${r.endDate != null ? #temporals.format(r.endDate, 'MMM d, yyyy') : 'today'}"></span>
          </td>
          <td th:if="${isAdmin}" class="small">
            <i class="bi bi-person-circle me-1 text-muted"></i>
            <span th:text="${r.owner.username}"></span>
          </td>
          <td class="small">
                        <span th:if="${r.includeAllUsers}" class="badge bg-info-subtle text-info border border-info-subtle">
                            <i class="bi bi-people me-1"></i>All users
                        </span>
            <span th:if="${!r.includeAllUsers}" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle">
                            <i class="bi bi-person me-1"></i>My works
                        </span>
          </td>
          <td class="text-nowrap" onclick="event.stopPropagation()">
            <a th:href="@{/reports/{id}/edit(id=${r.id})}"
               class="btn btn-outline-secondary btn-sm py-0 px-2 me-1" title="Edit period">
              <i class="bi bi-pencil"></i>
            </a>
            <form th:action="@{/reports/{id}/delete(id=${r.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('Delete this report?')">
              <button class="btn btn-outline-danger btn-sm py-0 px-2" title="Delete">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
