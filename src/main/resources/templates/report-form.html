<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' — Task Manager'">Report Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="apple-touch-icon" th:href="@{/apple-touch-icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-kanban me-1"></i> Task Manager
        </a>
    </div>
</nav>

<div class="container" style="max-width: 600px;">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
            <h4 class="mb-0 fw-bold">
                <i class="bi bi-file-earmark-text me-2 text-primary"></i>
                <span th:text="${pageTitle}">Report</span>
            </h4>
        </div>
        <div class="card-body p-4">

            <div th:if="${error}" class="alert alert-danger py-2" th:text="${error}"></div>

            <form th:action="${report.id != null} ? @{/reports/{id}(id=${report.id})} : @{/reports}"
                  th:object="${report}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" th:field="*{title}" class="form-control"
                           placeholder="e.g. Q3 2026 Self-Review (optional — auto-generated if left blank)">
                </div>

                <div class="row mb-3">
                    <div class="col-6">
                        <label class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
                        <input type="date" name="startDate" class="form-control"
                               th:value="${report.startDate != null ? #temporals.format(report.startDate, 'yyyy-MM-dd') : ''}"
                               required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-semibold">Finish Date</label>
                        <input type="date" name="endDate" class="form-control"
                               th:value="${report.endDate != null ? #temporals.format(report.endDate, 'yyyy-MM-dd') : ''}">
                        <div class="form-text">Leave blank to always include work up to today.</div>
                    </div>
                </div>

                <div class="mb-4 form-check" sec:authorize="hasRole('ADMIN')">
                    <input type="checkbox" name="includeAllUsers" value="true" class="form-check-input"
                           id="includeAllUsers" th:checked="${report.includeAllUsers}">
                    <label class="form-check-label" for="includeAllUsers">
                        Include all users' work (team retrospective), not just mine
                    </label>
                    <input type="hidden" name="includeAllUsers" value="false">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>
                        <span th:text="${report.id != null} ? 'Save Changes' : 'Create Report'">Save</span>
                    </button>
                    <a th:href="${report.id != null} ? @{/reports/{id}(id=${report.id})} : @{/reports}"
                       class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
