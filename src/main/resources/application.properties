spring.application.name=task-manager

# PostgreSQL
spring.datasource.url=${TASK_MANAGER_DB_URL:jdbc:postgresql://localhost:5432/taskmanagerdb}
spring.datasource.username=${TASK_MANAGER_DB_USER:taskmanager}
spring.datasource.password=${TASK_MANAGER_DB_PASSWORD:taskmanager}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=true

# Server
server.port=8080
server.forward-headers-strategy=native
server.servlet.session.timeout=1d
